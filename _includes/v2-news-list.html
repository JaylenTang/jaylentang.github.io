{% assign news = include.news %}
<div class="v2-news-list" role="list">
  {% for item in news limit:5 %}
    {% include v2-news-item.html item=item %}
  {% endfor %}
</div>
{% if news.size > 5 %}
<details class="v2-news-archive">
  <summary>Earlier News <i class="fas fa-chevron-down" aria-hidden="true"></i></summary>
  <div class="v2-news-list" role="list">
    {% for item in news offset:5 %}
      {% include v2-news-item.html item=item %}
    {% endfor %}
  </div>
</details>
{% endif %}
